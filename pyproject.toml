[project]
name = "lunar-rl"
version = "0.1.1"
description = "Causal-transformer + Impala-CNN PPO agent for LunarLander"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "gymnasium[box2d]>=1.1.1",
    "torch>=2.4",
    "numpy>=1.26",
]

[project.scripts]
lunar-rl = "lunar_rl.ppo:main"
lunar-rl-view = "lunar_rl.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_rl"]

[tool.uv]
# box2d-py builds from sdist and needs SWIG on PATH during the build.
# uv installs it into the isolated build env via this extra build dependency.
extra-build-dependencies = { box2d-py = ["swig"] }
